<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Checkout">
  <title>Saturn | Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">Saturn</a>
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="orders.html" class="auth-link logged-in-only">Orders</a>
        <a href="login.html" class="auth-link logged-out-only">Login</a>
        <a href="register.html" class="auth-link logged-out-only">Register</a>
        <button id="logoutBtn" class="nav-button logged-in-only">Logout</button>
        <a class="cart-link" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <span class="eyebrow">Order Processing</span>
        <h1>Checkout</h1>
        <p>Enter your shipping details and place your order.</p>
      </div>
    </section>

    <section class="section">
      <div class="container checkout-layout">
        <form id="checkoutForm" class="form-card">
          <h2>Shipping Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="shippingName">Full Name</label>
              <input id="shippingName" name="shippingName" type="text" required>
            </div>

            <div class="form-group">
              <label for="shippingEmail">Email</label>
              <input id="shippingEmail" name="shippingEmail" type="email" required>
            </div>

            <div class="form-group full-width">
              <label for="shippingAddress">Address</label>
              <textarea id="shippingAddress" name="shippingAddress" rows="4" required></textarea>
            </div>

            <div class="form-group">
              <label for="shippingCity">City</label>
              <input id="shippingCity" name="shippingCity" type="text" required>
            </div>

            <div class="form-group">
              <label for="shippingState">State</label>
              <input id="shippingState" name="shippingState" type="text" required>
            </div>

            <div class="form-group">
              <label for="shippingPostalCode">Postal Code</label>
              <input id="shippingPostalCode" name="shippingPostalCode" type="text" required>
            </div>
          </div>

          <div id="checkoutMessage" class="message hidden"></div>

          <button class="btn btn-primary btn-block" type="submit">Place Order</button>
        </form>

        <aside id="checkoutSummary" class="summary-card">
          <h2>Order Summary</h2>
          <div class="loading">Loading...</div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 Saturn.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
