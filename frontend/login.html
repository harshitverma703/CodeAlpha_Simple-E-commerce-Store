<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login">
  <title>Saturn | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">Saturn</a>
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a class="cart-link" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-heading">
        <span class="eyebrow">Welcome back</span>
        <h1>Login</h1>
        <p>Sign in to manage your cart and orders.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div id="loginMessage" class="message hidden"></div>

        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
