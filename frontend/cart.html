<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shopping cart">
  <title>ShopEase | Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">ShopEase</a>
      <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="orders.html" class="auth-link logged-in-only">Orders</a>
        <a href="login.html" class="auth-link logged-out-only">Login</a>
        <a href="register.html" class="auth-link logged-out-only">Register</a>
        <button id="logoutBtn" class="nav-button logged-in-only">Logout</button>
        <a class="cart-link active" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <span class="eyebrow">Checkout</span>
        <h1>Your Shopping Cart</h1>
        <p>Review your items before placing an order.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="cartContainer" class="cart-layout">
          <div class="loading">Loading cart...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 ShopEase.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/cart.js"></script>
</body>
</html>
